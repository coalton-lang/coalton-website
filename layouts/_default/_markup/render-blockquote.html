{{- if eq .Type "alert" -}}
<blockquote class="callout callout-{{ .AlertType }}">
  <p class="callout-title">
    {{- with .AlertTitle -}}
      {{ . }}
    {{- else -}}
      {{ or (i18n .AlertType) (title .AlertType) }}
    {{- end -}}
  </p>
  {{ .Text }}
</blockquote>
{{- else -}}
<blockquote>
  {{ .Text }}
</blockquote>
{{- end -}}
