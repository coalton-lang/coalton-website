{{- if or .Params.mermaid (.Page.Store.Get "hasMermaid") }}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({
    startOnLoad: true,
    theme: document.body.className.includes('dark') ? 'dark' : 'neutral'
  });
</script>
{{- end }}
